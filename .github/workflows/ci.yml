# Gate de integración: la regla 1 de los planes («suite verde y
# check_sizes.py OK antes de declarar hecha una tarea») deja de ser
# disciplina manual. Node 20 = mínimo contratado; 24 = verificado.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  suite-y-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/check_sizes.py
