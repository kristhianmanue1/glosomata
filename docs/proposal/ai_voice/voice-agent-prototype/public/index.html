<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Agent Prototype</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">Prueba local</p>
      <h1>Conversación con voz</h1>
      <p>
        Hable o escriba. El agente responderá con texto y el navegador intentará
        leer la respuesta en voz alta.
      </p>

      <section class="panel" aria-labelledby="conversation-title">
        <h2 id="conversation-title">Un turno de prueba</h2>
        <p id="agent-label" class="badge">Agente: cargando…</p>

        <form id="message-form">
          <label for="message">Su mensaje</label>
          <textarea id="message" name="message" maxlength="2000" rows="4"
            required></textarea>
          <div class="actions">
            <button id="speak" type="button">Hablar</button>
            <button id="stop" type="button" class="secondary" disabled>
              Terminar conversación
            </button>
            <button type="submit">Enviar</button>
          </div>
        </form>

        <p id="status" class="status" role="status" aria-live="polite">Listo.</p>

        <article id="response-card" class="response" hidden>
          <h3>Respuesta</h3>
          <p id="response-text"></p>
          <button id="listen" type="button" class="secondary">
            Escuchar respuesta
          </button>
        </article>
      </section>

      <p class="notice">
        No introduzca información personal o de salud. Esta versión no conserva
        audio ni conversaciones.
      </p>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
